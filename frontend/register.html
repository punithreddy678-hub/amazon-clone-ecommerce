<!DOCTYPE html>
<html>
<head>

    <title>Register</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    />

</head>

<body>

    <div class="auth-container">

        <div class="auth-box">

            <h2>Register</h2>

            <input
                type="text"
                placeholder="Name"
            />

            <input
                type="email"
                placeholder="Email"
            />

            <input
                type="password"
                placeholder="Password"
            />

            <button>
                Register
            </button>

        </div>

    </div>

</body>
</html>
