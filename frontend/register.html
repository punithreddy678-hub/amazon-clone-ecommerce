<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <div class="auth-page">

        <div class="auth-box">

            <h2>Create Account</h2>

            <input
                type="text"
                id="name"
                placeholder="Full Name"
            >

            <input
                type="email"
                id="email"
                placeholder="Email"
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
            >

<button onclick="register()">
    Register
</button>
            <p>

                Already have account?

                <a href="login.html">

                    Login

                </a>

            </p>

        </div>

    </div>

    <script src="js/signup.js"></script>
<script src="js/user.js"></script>
</body>

</html>
