<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8"/>

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0"/>

    <title>Payment</title>

    <link rel="stylesheet"
          href="css/style.css"/>

</head>
<body>

<div class="payment-page">

    <h1>Secure Payment</h1>

    <div class="payment-box">

        <input
            type="text"
            placeholder="Card Holder Name"
        />

        <input
            type="text"
            placeholder="Card Number"
        />

        <input
            type="text"
            placeholder="Expiry"
        />

        <input
            type="text"
            placeholder="CVV"
        />

        <button onclick="payNow()">
            Pay Now
        </button>

    </div>

</div>

<script>

function payNow(){

    alert(
        "Demo Payment Successful"
    );

    localStorage.removeItem("cart");

    window.location.href =
        "index.html";

}

</script>

</body>
</html>
